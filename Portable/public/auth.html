<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script>
        (function(){try{if((navigator.userAgent||'').indexOf('VolsmapAndroid')>=0)document.documentElement.classList.add('volsmap-android-app');}catch(e){}})();
    </script>
    <meta name="author" content="Карта оптической сети">
    <meta name="copyright" content="Copyright (c) 2024–2026 Карта оптической сети. Все права защищены.">
    <meta name="description" content="Вход в программу «Карта оптической сети» (локальная установка).">
    <meta name="robots" content="noindex, nofollow">
    <title>Вход — Карта оптической сети</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('networkMap_landingTheme') || localStorage.getItem('networkMap_theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = (saved === 'dark' || saved === 'light') ? saved : (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/scrollbars.css">
    <link rel="stylesheet" href="css/android-app.css">
    <script>
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) || (e.ctrlKey && (e.key === 'U' || e.key === 'u'))) {
                e.preventDefault(); return false;
            }
        });
        document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
    </script>
    <style>
        body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        input, textarea { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }
    </style>
</head>
<body class="auth-page">
    <div class="auth-bg landing-bg" aria-hidden="true">
        <div class="auth-bg-gradient landing-bg-gradient"></div>
        <div class="landing-bg-grid"></div>
        <div class="auth-bg-orbs">
            <span class="auth-orb auth-orb--a"></span>
            <span class="auth-orb auth-orb--b"></span>
            <span class="auth-orb auth-orb--c"></span>
        </div>
        <canvas id="authPlexusCanvas" class="auth-bg-plexus"></canvas>
    </div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo" role="img" aria-label="Карта оптической сети">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </div>
                <p class="auth-brand">Карта оптической сети</p>
                <h1 id="authPageTitle">Вход в систему</h1>
                <p class="auth-subtitle" id="authPageSubtitle">Локальная установка для работы с оптической сетью</p>
            </div>

            <form id="loginForm" class="auth-form active">
                <h2 class="visually-hidden">Вход</h2>

                <div class="form-group">
                    <label for="loginUsername">Имя пользователя</label>
                    <div class="input-wrapper">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="loginUsername" placeholder="Введите имя пользователя" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Пароль</label>
                    <div class="input-wrapper has-toggle">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="loginPassword" placeholder="Введите пароль" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePassword('loginPassword')" aria-label="Показать пароль">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <small class="hint">Забыли пароль? Обратитесь к администратору организации — он может сбросить пароль в настройках пользователей.</small>
                </div>

                <div class="form-group form-group-inline">
                    <label class="checkbox-label">
                        <input type="checkbox" id="loginRememberMe" checked>
                        <span class="checkbox-ui" aria-hidden="true"></span>
                        <span class="checkbox-text">Запомнить меня <span class="checkbox-hint">(месяц)</span></span>
                    </label>
                </div>

                <button type="submit" class="btn-primary" id="loginSubmitBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                    Войти
                </button>
            </form>

            <div id="authMessage" class="auth-message"></div>

            <div class="auth-page-legal">
                <p class="auth-license">© 2024–2026 Карта оптической сети · Portable</p>
            </div>
        </div>
    </div>

    <script src="js/core/config.js"></script>
    <script src="js/core/android-app.js"></script>
    <script src="js/app/auth.js"></script>
    <script src="js/ui/assistant-avatars.js"></script>
    <script src="js/core/page-bg-plexus.js"></script>
</body>
</html>
